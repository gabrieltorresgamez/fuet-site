# After arc.fuet.ch. Hashed build files (/_astro/) never change; other static files may change with each build.
map $uri $cache_control {
    ~^/_astro/                "public, max-age=31536000, immutable";
    ~*\.(css|js|svg|woff2)$   "public, max-age=86400";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json application/rss+xml image/svg+xml;
    server_tokens off;
    absolute_redirect off;  # the reverse proxy in front owns scheme and host
    access_log off;  # the reverse proxy in front keeps the request log (7 days, see /privacy/)

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/rss+xml image/svg+xml;

    # Server level only: an add_header inside a location would drop all of these for that location.
    add_header Cache-Control $cache_control;
    add_header Strict-Transport-Security "max-age=31536000" always;  # ignored by browsers over plain HTTP
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    error_page 404 /404.html;

    # URLs the Ghost site had
    location = /privacy-policy/ { return 301 /privacy/; }
    location = /sitemap.xml     { return 301 /sitemap-index.xml; }
    location = /rss/ {
        types { }
        default_type application/rss+xml;
        try_files /rss.xml =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
